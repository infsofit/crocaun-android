name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve Windows release version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            android_tag="$GITHUB_REF_NAME"
            version="${android_tag#v}"
            windows_release="$(curl --fail --silent --show-error --location \
              "https://api.github.com/repos/infsofit/crocaun/releases/tags/${android_tag}")"
            windows_tag="$(jq -r '.tag_name // empty' <<< "$windows_release")"
            if [[ "$windows_tag" != "$android_tag" ]]; then
              echo "Android tag ${android_tag} has no matching Windows release in infsofit/crocaun." >&2
              exit 1
            fi
          else
            latest_release="$(curl --fail --silent --show-error --location \
              https://api.github.com/repos/infsofit/crocaun/releases/latest)"
            windows_tag="$(jq -r '.tag_name // empty' <<< "$latest_release")"
            if [[ "$windows_tag" != v* ]]; then
              echo "Could not resolve the latest Windows release tag." >&2
              exit 1
            fi
            version="${windows_tag#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Unsupported Windows release version: ${version}" >&2
            exit 1
          fi

          echo "Building Crocaun Android for Windows version ${version} (${windows_tag})."
          echo "version_name=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: resolve-version
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Build and test
        run: >-
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
          -PcrocaunVersion=${{ needs.resolve-version.outputs.version_name }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crocaun-android-v${{ needs.resolve-version.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-preview-release:
    name: Publish matching preview release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [resolve-version, build]
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: crocaun-android-v${{ needs.resolve-version.outputs.version_name }}-debug
          path: release-apk

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-version.outputs.version_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk="release-apk/app-debug.apk"
          mv "$apk" "release-apk/crocaun-android-v${VERSION}-preview.apk"
          gh release create "$TAG" "release-apk/crocaun-android-v${VERSION}-preview.apk" \
            --title "Crocaun Android v${VERSION}" \
            --prerelease \
            --notes "Preview build aligned to the Windows release ${TAG}. This APK is debug-signed and is not a Google Play production release."
