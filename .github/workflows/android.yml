name: Android build and Windows release sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android-only version to publish after its release gates pass (e.g. 1.11-android.1)"
        required: false
        type: string
      interop_confirmed:
        description: "Set true only after real Android↔Windows interoperability tests pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  discover:
    name: Resolve matching Windows releases
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.releases.outputs.version_name }}
      candidates: ${{ steps.releases.outputs.candidates }}
    steps:
      - name: Check out Android source
        uses: actions/checkout@v7

      - name: Find stable releases missing an Android preview
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/discover_releases.py

  build-check:
    name: Build and test latest Android version
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: discover
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test Android release-version parser
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            go-core/go.mod
            go-core/go.sum

      - name: Build and test Croc Android AAR
        run: scripts/build-transfer-aar.sh

      - name: Build and test
        run: >-
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
          -PcrocaunVersion=${{ needs.discover.outputs.version_name }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crocaun-android-v${{ needs.discover.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload transfer AAR for integration testing
        uses: actions/upload-artifact@v4
        with:
          name: crocaun-transfer-aar
          path: app/libs/crocaun-transfer.aar
          if-no-files-found: error
          retention-days: 14

      - name: Build Android-suffix version smoke APK
        env:
          BASE_VERSION: ${{ needs.discover.outputs.version_name }}
        run: >-
          ./gradlew --no-daemon --stacktrace assembleDebug
          -PcrocaunVersion=${BASE_VERSION}-android.1

      - name: Upload Android-suffix version smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: crocaun-android-v${{ needs.discover.outputs.version_name }}-android-suffix-smoke
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-previews:
    name: Publish ${{ matrix.tag }} Android preview
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.android_version == '')) && needs.discover.outputs.candidates != '[]'
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.candidates) }}
    permissions:
      contents: write
    steps:
      - name: Check out existing Android tag
        if: matrix.tag_exists == true
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ matrix.tag }}

      - name: Check out current Android main
        if: matrix.tag_exists != true
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            go-core/go.mod
            go-core/go.sum

      - name: Build Croc Android AAR
        run: scripts/build-transfer-aar.sh

      - name: Build and test matching version
        run: >-
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
          -PcrocaunVersion=${{ matrix.version }}

      - name: Prepare preview APK
        env:
          TAG: ${{ matrix.tag }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "crocaun-android-${TAG}-preview.apk"

      - name: Create or repair GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          VERSION: ${{ matrix.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="crocaun-android-${TAG}-preview.apk"
          source_sha="$(git rev-parse HEAD)"
          notes="Early Android preview aligned to the published Windows release ${TAG}. It includes LAN chat and an experimental single-file Croc Send/Receive UI using Android Storage Access Framework. Croc interoperability has not yet been verified between Windows and Android; background transfer, cancellation, and byte-level progress are not implemented. Internet/Nostr chat is not implemented. This APK is debug-signed and is not a Google Play production release."
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" "$apk" \
              --repo "$REPOSITORY" \
              --target "$source_sha" \
              --title "Crocaun Android ${TAG}" \
              --prerelease \
              --notes "$notes"
          fi

  publish-android-suffix:
    name: Publish Android-only ${{ inputs.android_version }}
    if: github.event_name == 'workflow_dispatch' && inputs.android_version != ''
    runs-on: ubuntu-latest
    needs: discover
    permissions:
      contents: write
    steps:
      - name: Check out current Android main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate Android version and matching stable Windows release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_VERSION: ${{ inputs.android_version }}
          INTEROP_CONFIRMED: ${{ inputs.interop_confirmed }}
        run: python3 scripts/validate_android_suffix_release.py "$ANDROID_VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            go-core/go.mod
            go-core/go.sum

      - name: Build Croc Android AAR
        run: scripts/build-transfer-aar.sh

      - name: Build and test Android-only version
        env:
          ANDROID_VERSION: ${{ steps.version.outputs.android_version }}
        run: >-
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
          -PcrocaunVersion="$ANDROID_VERSION"

      - name: Prepare preview APK
        env:
          ANDROID_TAG: ${{ steps.version.outputs.android_tag }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "crocaun-android-${ANDROID_TAG}-preview.apk"

      - name: Create Android-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_TAG: ${{ steps.version.outputs.android_tag }}
          ANDROID_VERSION: ${{ steps.version.outputs.android_version }}
          BASE_WINDOWS_VERSION: ${{ steps.version.outputs.base_windows_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="crocaun-android-${ANDROID_TAG}-preview.apk"
          source_sha="$(git rev-parse HEAD)"
          notes="Android-only prerelease ${ANDROID_TAG}, based on stable Windows release v${BASE_WINDOWS_VERSION}. This tag does not create or modify a Windows release. The APK is debug-signed and is not a Google Play production build."
          gh release create "$ANDROID_TAG" "$apk" \
            --repo "$REPOSITORY" \
            --target "$source_sha" \
            --title "Crocaun Android ${ANDROID_TAG}" \
            --prerelease \
            --notes "$notes"
