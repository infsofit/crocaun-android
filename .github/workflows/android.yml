name: Android build and Windows release sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Resolve matching Windows releases
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.releases.outputs.version_name }}
      candidates: ${{ steps.releases.outputs.candidates }}
    steps:
      - name: Check out Android source
        uses: actions/checkout@v7

      - name: Find stable releases missing an Android preview
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/discover_releases.py

  build-check:
    name: Build and test latest Android version
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: discover
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Build and test
        run: >-
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
          -PcrocaunVersion=${{ needs.discover.outputs.version_name }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crocaun-android-v${{ needs.discover.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-previews:
    name: Publish ${{ matrix.tag }} Android preview
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.discover.outputs.candidates != '[]'
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.candidates) }}
    permissions:
      contents: write
    steps:
      - name: Check out existing Android tag
        if: matrix.tag_exists == true
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ matrix.tag }}

      - name: Check out current Android main
        if: matrix.tag_exists != true
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Build and test matching version
        run: >-
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
          -PcrocaunVersion=${{ matrix.version }}

      - name: Prepare preview APK
        env:
          TAG: ${{ matrix.tag }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "crocaun-android-${TAG}-preview.apk"

      - name: Create or repair GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          VERSION: ${{ matrix.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="crocaun-android-${TAG}-preview.apk"
          source_sha="$(git rev-parse HEAD)"
          notes="Preview APK aligned to the published Windows release ${TAG}. This artifact is debug-signed and is not a Google Play production release."
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" "$apk" \
              --repo "$REPOSITORY" \
              --target "$source_sha" \
              --title "Crocaun Android ${TAG}" \
              --prerelease \
              --notes "$notes"
          fi
